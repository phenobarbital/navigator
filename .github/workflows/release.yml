name: Python package build and publish

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds - use manylinux for maximum compatibility
          - os: ubuntu-latest
            python-version: "3.11"
            pyver: "311"
            platform: linux
          - os: ubuntu-latest
            python-version: "3.12"
            pyver: "312"
            platform: linux
          - os: ubuntu-latest
            python-version: "3.13"
            pyver: "313"
            platform: linux
          - os: ubuntu-latest
            python-version: "3.13"
            pyver: "314"
            platform: linux
          # Windows builds - win_amd64 only
          - os: windows-latest
            python-version: "3.11"
            pyver: "311"
            platform: windows
          - os: windows-latest
            python-version: "3.12"
            pyver: "312"
            platform: windows
          - os: windows-latest
            python-version: "3.13"
            pyver: "313"
            platform: windows
          - os: windows-latest
            python-version: "3.13"
            pyver: "314"
            platform: windows

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history for setuptools-scm
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build wheels for Linux (manylinux)
        if: matrix.platform == 'linux'
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: cp${{ matrix.pyver }}-*
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # Skip i686, musllinux, PyPy ("pp*"), and free-threaded builds
          # ("*t-*"). win32/win_arm64 build identifiers never occur on a
          # Linux job (they are Windows platform tags) and macOS is out
          # of scope for this feature entirely, so neither needs a
          # pattern here.
          CIBW_SKIP: "*-manylinux_i686 *-musllinux* pp* *t-*"
          CIBW_BEFORE_BUILD: >
            pip install setuptools>=67.6.1 Cython>=3.1.4 wheel>=0.44.0 setuptools-scm>=8.0 &&
            (yum install -y postgresql-devel openssl-devel zlib-devel libmemcached-devel xmlsec1-devel libtool-ltdl-devel ||
            (apt-get update && apt-get install -y libpq-dev libssl-dev zlib1g-dev libmemcached-dev libxmlsec1-dev))
          CIBW_TEST_REQUIRES: pytest
          # Import the two Cython extensions explicitly and assert they
          # resolved to a compiled .so (not e.g. a stray .py shadow), so a
          # regression in the Cython build silently falling back — or the
          # extensions going missing from the wheel — fails CI instead of
          # passing on the pure-Python "import navigator" smoke test alone.
          CIBW_TEST_COMMAND: python -c "import navigator, navigator.types, navigator.utils.types; assert navigator.types.__file__.endswith('.so'), f'navigator.types not compiled -> {navigator.types.__file__}'; assert navigator.utils.types.__file__.endswith('.so'), f'navigator.utils.types not compiled -> {navigator.utils.types.__file__}'; print('OK - Navigator test passed:', navigator.version()); print('OK - Compiled extensions verified:', navigator.types.__file__, navigator.utils.types.__file__)"
          # cp314: asyncdb and python-datamodel (both runtime dependencies)
          # do not yet publish finalized cp314 wheels, so a full dependency
          # install can fail even though Navigator's own extensions compile
          # and the wheel is structurally correct. Skip only the post-build
          # install/import test for cp314; the archive check below (which
          # never installs the runtime dependency graph) still blocks the
          # job for every pyver, including cp314.
          CIBW_TEST_SKIP: ${{ matrix.pyver == '314' && 'cp314-*' || '' }}

      - name: Build wheels for Windows (win_amd64)
        if: matrix.platform == 'windows'
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: cp${{ matrix.pyver }}-*
          CIBW_ARCHS_WINDOWS: "AMD64"
          # Skip win32/win_arm64, PyPy ("pp*"), and free-threaded builds
          # ("*t-*"). musllinux/manylinux i686/macOS do not apply to Windows.
          CIBW_SKIP: "*-win32 *-win_arm64 pp* *t-*"
          CIBW_BEFORE_BUILD: >
            pip install setuptools>=67.6.1 Cython>=3.1.4 wheel>=0.44.0 setuptools-scm>=8.0
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -c "import navigator, navigator.types, navigator.utils.types; assert navigator.types.__file__.endswith('.pyd'), f'navigator.types not compiled -> {navigator.types.__file__}'; assert navigator.utils.types.__file__.endswith('.pyd'), f'navigator.utils.types not compiled -> {navigator.utils.types.__file__}'; print('OK - Navigator test passed:', navigator.version()); print('OK - Compiled extensions verified:', navigator.types.__file__, navigator.utils.types.__file__)"
          # See the Linux job's CIBW_TEST_SKIP comment: cp314 upstream
          # runtime dependencies (asyncdb, python-datamodel) are not yet
          # published for cp314, so only the install/import test is
          # skipped there. Structural validation remains blocking below.
          CIBW_TEST_SKIP: ${{ matrix.pyver == '314' && 'cp314-*' || '' }}

      - name: Install validation test dependencies
        run: python -m pip install --quiet pytest

      - name: Verify compiled extensions are present in the wheel
        shell: bash
        run: |
          python - <<'PYEOF'
          import glob
          import sys

          # Reuse the pure-stdlib wheel-validation helpers from the focused
          # test suite (FEAT-007 / TASK-2952) instead of re-implementing
          # archive/tag parsing here.
          sys.path.insert(0, "tests")
          from test_release_wheel import (  # noqa: E402
              is_supported_linux_platform_tag,
              is_supported_windows_platform_tag,
              missing_required_extensions,
              parse_wheel_tags,
              wheel_archive_members,
          )

          platform = "${{ matrix.platform }}"
          suffix = ".pyd" if platform == "windows" else ".so"

          wheels = glob.glob("wheelhouse/*.whl")
          if not wheels:
              sys.exit("ERROR: No wheels found in wheelhouse/")

          for wheel_path in wheels:
              members = wheel_archive_members(wheel_path)
              missing = missing_required_extensions(members, suffix)
              if missing:
                  sys.exit(f"ERROR: {wheel_path}: missing compiled extension(s) for {missing}")

              _python_tag, _abi_tag, platform_tag = parse_wheel_tags(wheel_path)
              if platform == "windows":
                  supported = is_supported_windows_platform_tag(platform_tag)
              else:
                  supported = is_supported_linux_platform_tag(platform_tag)
              if not supported:
                  sys.exit(f"ERROR: {wheel_path}: unsupported platform tag {platform_tag}")

              print(f"OK: {wheel_path}: required extensions present ({platform_tag})")
          PYEOF

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.pyver }}
          path: wheelhouse/*.whl

  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history for setuptools-scm
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel setuptools-scm

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*.tar.gz

  deploy:
    needs: [build, build-source]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/navigator-api
    permissions:
      id-token: write  # For trusted publishing

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Organize artifacts by platform
        run: |
          mkdir -p dist/linux dist/windows dist/source

          # Move artifacts to platform-specific directories
          find dist-artifacts -name '*-manylinux*.whl' -exec mv {} dist/linux/ \;
          find dist-artifacts -name '*-win_amd64.whl' -exec mv {} dist/windows/ \;

          find dist-artifacts -name '*.tar.gz' -exec mv {} dist/source/ \;

          echo "=== Linux wheels (manylinux) ==="
          ls -la dist/linux/ || echo "No Linux wheels found"

          echo "=== Windows wheels (win_amd64) ==="
          ls -la dist/windows/ || echo "No Windows wheels found"

          echo "=== Source distribution ==="
          ls -la dist/source/ || echo "No source distribution found"

      - name: Upload Linux wheels (manylinux)
        if: hashFiles('dist/linux/*.whl') != ''
        run: |
          echo "Uploading Linux manylinux wheels..."
          uv tool run twine upload dist/linux/*-manylinux*.whl --username __token__ --password ${{ secrets.NAVIGATOR_API_PYPI_API_TOKEN }}

      - name: Upload Windows wheels (win_amd64)
        if: hashFiles('dist/windows/*.whl') != ''
        run: |
          echo "Uploading Windows win_amd64 wheels..."
          uv tool run twine upload dist/windows/*-win_amd64.whl --username __token__ --password ${{ secrets.NAVIGATOR_API_PYPI_API_TOKEN }}

      - name: Upload source distribution
        if: hashFiles('dist/source/*.tar.gz') != ''
        run: |
          echo "Uploading source distribution..."
          uv tool run twine upload dist/source/*.tar.gz --username __token__ --password ${{ secrets.NAVIGATOR_API_PYPI_API_TOKEN }}

  test-installation:
    needs: deploy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            continue-on-error: false
          - os: ubuntu-latest
            python-version: "3.12"
            continue-on-error: false
          - os: ubuntu-latest
            python-version: "3.13"
            continue-on-error: false
          # cp314: asyncdb / python-datamodel do not yet publish cp314
          # wheels. Structural wheel validation for cp314 already runs
          # (and blocks) in the build job above; only this dependency-heavy
          # install test is allowed to fail here.
          - os: ubuntu-latest
            python-version: "3.14"
            continue-on-error: true
          - os: windows-latest
            python-version: "3.11"
            continue-on-error: false
          - os: windows-latest
            python-version: "3.12"
            continue-on-error: false
          - os: windows-latest
            python-version: "3.13"
            continue-on-error: false
          - os: windows-latest
            python-version: "3.14"
            continue-on-error: true
    continue-on-error: ${{ matrix.continue-on-error }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for PyPI propagation
        run: |
          echo "Waiting 2 minutes for PyPI to propagate the new release..."
          python -c "import time; time.sleep(120)"

      - name: Install package from PyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Try installing with retries in case of propagation delays.
          # Fail the step (instead of silently continuing to later steps)
          # if every attempt is exhausted.
          installed=false
          for i in {1..5}; do
            if pip install navigator-api --no-cache-dir; then
              echo "Successfully installed navigator-api"
              installed=true
              break
            else
              echo "Attempt $i failed, waiting 30 seconds..."
              sleep 30
            fi
          done
          if [ "$installed" != "true" ]; then
            echo "::error::Failed to install navigator-api from PyPI after 5 attempts"
            exit 1
          fi

      - name: Prepare navconfig project environment
        shell: bash
        run: |
          # navconfig searches for project markers walking up from its own
          # site-packages location, not from CWD. Without the required
          # markers it raises FileExistsError/ProjectDetectionError on
          # import. Scaffold a temp project root with the supported
          # markers (env/<ENV>/.env, .env, pyproject.toml, etc/config.ini)
          # and export SITE_ROOT/ENV for the next steps, matching the
          # focused test fixture in tests/test_release_wheel.py.
          ROOT="${RUNNER_TEMP}/nav-root"
          mkdir -p "${ROOT}/etc" "${ROOT}/env/dev"
          touch "${ROOT}/.env"
          touch "${ROOT}/env/dev/.env"
          touch "${ROOT}/pyproject.toml"
          printf "[navconfig]\n" > "${ROOT}/etc/config.ini"
          echo "SITE_ROOT=${ROOT}" >> "$GITHUB_ENV"
          echo "ENV=dev" >> "$GITHUB_ENV"

      - name: Test basic imports
        working-directory: ${{ runner.temp }}/nav-root
        shell: bash
        run: |
          python -c "import navigator; print('OK: Navigator import successful')"
          python -c "import navigator.types, navigator.utils.types; print('OK: Compiled extensions import successful')"
          python -c "import navigator.commands; print('OK: Commands import successful')"
          python -c "from navigator.version import __version__; print('OK: Version:', __version__)"

      - name: Test CLI command
        working-directory: ${{ runner.temp }}/nav-root
        shell: bash
        run: |
          nav --version || echo "WARNING: CLI test failed on ${{ matrix.os }}"

      - name: Test package contents
        working-directory: ${{ runner.temp }}/nav-root
        shell: bash
        run: |
          python -c "
          import navigator
          import os
          navigator_path = os.path.dirname(navigator.__file__)

          # Check for critical directories
          critical_dirs = ['commands', 'templates', 'static']
          missing_dirs = []

          for dir_name in critical_dirs:
              dir_path = os.path.join(navigator_path, dir_name)
              if os.path.exists(dir_path):
                  print(f'OK: {dir_name} directory found')
              else:
                  missing_dirs.append(dir_name)
                  print(f'ERROR: {dir_name} directory missing')

          if missing_dirs:
              print(f'WARNING: Missing directories: {missing_dirs}')
              exit(1)
          else:
              print('OK: All critical directories present')
          "

  test-summary:
    needs: test-installation
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Test Results Summary
        run: |
          echo "## 🎉 Release Testing Complete"
          echo "✅ Package successfully built for Linux (manylinux x86_64) and Windows (win_amd64)"
          echo "✅ Package uploaded to PyPI"
          echo "✅ Installation and import tests completed for cp311-cp314 on both platforms"
          echo ""
          echo "The new release is ready for use! 🚀"
